[package]
name = "a5db"
version = "0.1.0"
edition = "2021"
description = "Agilex 5 (sm4revb) configuration database: read and write named bits and attributes in .sof images"

[dependencies]
anyhow = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
hmac = "0.12"
serde_json = "1"
sha2 = "0.10"

[profile.release]
debug = 1
