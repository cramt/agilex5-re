[package]
name = "a5synth"
version = "0.1.0"
edition = "2021"
description = "chipsmith's synthesis for a5pnr: Verilog to 6-LUTs, carry chains, flops and MLAB RAM, in a5pnr's yosys-JSON vocabulary"

[dependencies]
# chipsmith's front end and device-independent synthesis with its K-input
# LUT mapper (chipsmith ADR-0013), pinned like cyclone2-re's cram pins
# chipsmith-cyclone2. open a780413, a5-almcost merged: the mapper's LUT
# cost by input count and kept best cut (README (z14)). Moved from the
# branch commit 35f73c5 with every board and bench netlist unchanged
# (tools/a5synth/same.sh).
chipsmith-netlist = { git = "https://github.com/A-H-Technology/chipsmith", rev = "a7804138832d219ee087bb0cc26c8a981588565a" }
chipsmith-synth = { git = "https://github.com/A-H-Technology/chipsmith", rev = "a7804138832d219ee087bb0cc26c8a981588565a" }
chipsmith-verilog = { git = "https://github.com/A-H-Technology/chipsmith", rev = "a7804138832d219ee087bb0cc26c8a981588565a" }
anyhow = "1"
rustc-hash = "2"

[profile.release]
debug = 1

